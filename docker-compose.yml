services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-manga-translator-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    restart: unless-stopped
